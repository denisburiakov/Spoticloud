<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SpotiCloud | Student Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="upload-section" style="margin-bottom: 30px; padding: 20px; border: 1px solid #ccc;">
    <h3>Загрузить новый трек</h3>
    <input type="text" id="trackTitle" placeholder="Название трека">
    <input type="file" id="trackFile" accept=".mp3">
    <button onclick="uploadFile()">Загрузить</button>
    <p id="uploadStatus"></p>
</div>
<div class="container">
    <header>
        <h1>SpotiCloud</h1>
        <input type="text" id="searchInput" placeholder="Поиск треков...">
    </header>

    <main id="trackList">
        <p class="loading">Загружаем музыку...</p>
    </main>
</div>

<div class="player-bar">
    <div id="currentTrackTitle">Выберите трек</div>
    <audio id="mainAudio" controls></audio>
</div>

<script src="app.js"></script>
</body>
</html>
