<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiCloud | Student Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" style="position: relative;">

    <div class="global-lang-selector" style="position: absolute; top: 15px; right: 15px; z-index: 9999;">
        <select id="langSelect" onchange="changeLanguage(this.value)" style="background: #282828; color: #fff; border: 1px solid #404040; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 14px; outline: none;">
            <option value="ru">🇷🇺 RU</option>
            <option value="en">🇺🇸 EN</option>
        </select>
    </div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3 data-translate="sidebarTitle">Профиль</h3>
            <button onclick="toggleSidebar(false)" class="btn-close-sidebar">×</button>
        </div>
        <div class="sidebar-content">
            <div class="user-profile-card">
                <div class="avatar-placeholder">👤</div>
                <h2 id="sidebarUsername">Username</h2>
                <p id="sidebarRole" class="role-badge">User</p>
            </div>

            <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

            <button id="toArtistConsole" class="btn-sidebar-action" style="display:none;" onclick="showView('artist-page'); toggleSidebar(false);" data-translate="btnToConsole">Для артистов</button>

            <button onclick="handleLogout()" class="btn-sidebar-action logout-btn" data-translate="btnLogout">Выйти из аккаунта</button>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar(false)"></div>

    <section id="auth-page" class="view">
        <div class="auth-box" style="padding-top: 50px;">
            <h1 class="logo-text">SpotiCloud</h1>

            <div class="auth-tabs">
                <span id="tab-login" onclick="switchAuthMode('login')" data-translate="tabLogin">Вход</span>
                <span id="tab-register" class="active" onclick="switchAuthMode('register')" data-translate="tabRegister">Регистрация</span>
            </div>

            <div class="form-group">
                <input type="text" id="authUsername" placeholder="Логин (Username)" data-placeholder="placeholderUsername">

                <div id="register-only-fields">
                    <input type="email" id="authEmail" placeholder="Email" data-placeholder="placeholderEmail">
                    <label class="checkbox-container">
                        <input type="checkbox" id="isArtistCheck" onchange="toggleArtistInput()">
                        <span data-translate="labelArtist">Я артист</span>
                    </label>
                    <div id="artistNameField" style="display: none;">
                        <input type="text" id="authArtistName" placeholder="Твоё сценическое имя" data-placeholder="placeholderArtistName">
                    </div>
                </div>

                <input type="password" id="authPassword" placeholder="Пароль" data-placeholder="placeholderPassword">

                <button id="authBtn" onclick="handleAuthSubmit()" class="btn-main" data-translate="btnRegister">Зарегистрироваться</button>
            </div>
        </div>
    </section>

    <section id="main-page" class="view" style="display:none;">
        <header class="main-header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button onclick="toggleSidebar(true)" style="background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 0; line-height: 1;">☰</button>
                <h1 data-translate="mainHeader">Главная</h1>
            </div>
            <div class="header-actions">
                <input type="text" id="searchInput" placeholder="Поиск любимых треков..." data-placeholder="placeholderSearch">
            </div>
        </header>

        <div id="trackList" class="track-grid">
            <p class="status-msg" data-translate="statusLoading">Загрузка музыки...</p>
        </div>
    </section>

    <section id="artist-page" class="view" style="display:none;">
        <header class="sub-header">
            <button onclick="showView('main-page')" class="btn-back" data-translate="btnBack">← Назад</button>
            <h2 data-translate="consoleHeader">Консоль артиста</h2>
        </header>

        <div class="upload-container">
            <h3 data-translate="uploadTitle">Добавить новый сингл</h3>
            <div class="upload-form">
                <div class="file-input">
                    <label data-translate="labelTrackFile">Файл трека (.mp3):</label>
                    <input type="file" id="trackFile" accept=".mp3">
                </div>
                <div class="file-input">
                    <label data-translate="labelCoverFile">Обложка (image):</label>
                    <input type="file" id="coverFile" accept="image/*">
                </div>
                <button onclick="uploadFile()" class="btn-main" data-translate="btnPublish">Опубликовать в SpotiCloud</button>
            </div>
            <p class="hint" data-translate="hintFormat">* Формат названия файла: Артист - Название.mp3</p>
        </div>
    </section>

    <section id="artist-profile-page" class="view" style="display:none;">
    </section>
</div>

<footer id="player-bar" class="player-bar" style="display:none;">
    <div class="player-info">
        <img id="playerCover" src="https://via.placeholder.com/150" alt="Cover">
        <div>
            <div id="currentTrackTitle" style="font-weight:bold;" data-translate="playerDefaultTitle">Выберите трек</div>
            <div id="currentTrackArtist" style="font-size: 0.8rem; color: #b3b3b3;" data-translate="playerDefaultArtist">Исполнитель</div>
        </div>
    </div>
    <audio id="mainAudio" controls></audio>
    <div style="width: 30%;"></div>
</footer>

<script src="app.js"></script>
</body>
</html>
