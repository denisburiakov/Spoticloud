<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SpotiCloud | Student Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="upload-section">
    <label>Музыка: <input type="file" id="trackFile" accept=".mp3"></label>
    <label>Обложка: <input type="file" id="coverFile" accept="image/*"></label>
    <button onclick="uploadFile()">Загрузить</button>
    <p style="font-size: 0.8em; color: #ccc; margin-top: 5px;">
        * Файл должен быть в формате: <strong>Артист - Название.mp3</strong>
    </p>
</div>

<button id="backBtn" style="display: none; margin-bottom: 20px;" onclick="location.reload()">← Назад ко всем трекам</button>

<div class="container">
    <header>
        <h1>SpotiCloud</h1>
        <input type="text" id="searchInput" placeholder="Поиск треков...">
    </header>

    <main id="trackList">
        <p class="loading">Загружаем музыку...</p>
    </main>
</div>

<div class="player-bar">
    <div id="currentTrackTitle">Выберите трек</div>
    <audio id="mainAudio" controls></audio>
</div>

<script src="app.js"></script>
</body>
</html>
